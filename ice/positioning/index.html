<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0..1,0">
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap">
    <title>Document</title>
</head>

<body>
<article class="post">

  <header class="post-header">

    
    <img class="avatar" src="images/Jack.jpg" alt="Jack standing">
    <span class="username">Jack_I._Box</span>
    <span class="time">20 mins</span>
    <button class="menu" aria-label="More options">
      <span class="material-symbols-outlined">more_vert</span>
    </button>
  </header>
  
  <img class="photo" src="images/road.jpg" alt="Winding coastal road beside a blue ocean">
  

  <footer class="post-footer">
    <button class="action" aria-label="Save">
      <span class="material-symbols-outlined filled">bookmark</span>
    </button>
    <button class="action" aria-label="Share">
      <span class="material-symbols-outlined filled">share</span>
    </button>
    <button class="action" aria-label="Comments">
      <span class="material-symbols-outlined">chat_bubble</span>
      1034
    </button>

    <span class="spacer"></span>

    <button class="action like" id="like" aria-label="Like">
      <span id="count">8002</span>
      <span class="material-symbols-outlined" id="heart">favorite</span>
    </button>
  </footer>

</article>
</body>
</html>
