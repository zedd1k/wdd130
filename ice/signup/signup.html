<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daily Feed Sign Up</title>

    <style>
        * {
            margin: 0;
            box-sizing: border-box;
        }
        body {
          background: rgba(120, 96, 64, 10);
        background: linear-gradient(359deg,rgba(120, 96, 64, 1) 31%, rgba(67, 109, 247, 1) 100%);
            font-family: "Times New Roman", Times, serif;
        }
        #formContainer {
            width: 90%;
            max-width: 400px;
            margin: 30px auto;
            background: white;
            border: 18px solid #1a2f7a;
            border-radius: 40px;
            overflow: hidden;
        }
        .banner {
            position: relative;
            height: 170px;
            background: url("images/jesus_feeds_5000.jpeg") center 20% / cover no-repeat;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .banner h1 {
            font-size: 2.2rem;
        }
        .banner p {
            font-size: 1.8rem;
            font-weight: bold;
        }
        #closeBtn {
            position: absolute;
            top: 10px;
            left: 10px;
            padding: 6px 12px;
            font-size: 1.1rem;
            cursor: pointer;
            text-shadow: none;
        }
        h3 {
            text-align: center;
            padding: 16px 0 8px;
        }
        #myForm {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px 10px;
            align-items: center;
            padding: 10px 20px 20px;
        }
        #myForm input[type="text"],
        #myForm input[type="password"],
        #myForm input[type="email"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #999;
            border-radius: 4px;
        }
        #myForm section {
            grid-column: 1 / -1;
            text-align: center;
        }
        .books {
            display: flex;
            gap: 4px;
            background: white;
        }
        .books img {
            flex: 1;
            min-width: 25px;
            height: 185px;
            object-fit: contain;
            object-position: bottom;
            display: block;
        }
    </style>
</head>

<body>
    <div id="formContainer">
        <div class="banner">
            <button type="button" id="closeBtn">X</button>
            <h1>Daily Feed</h1>
            <p>Scripture a Day</p>
        </div>

        <h3>Sign Up for Daily Scripture Feed</h3>
        <form id="myForm">
            <label for="username">User Name:</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label>Gender:</label>
            <div>
                <input type="radio" id="male" name="gender" value="male" required>
                <label for="male">Male</label>
                <input type="radio" id="female" name="gender" value="female" required>
                <label for="female">Female</label>
            </div>

            <section>
                <input type="checkbox" id="newsletter" name="newsletter">
                <label for="newsletter">Subscribe to newsletter</label>
            </section>

            <section>
                <input type="checkbox" id="conditions" name="conditions" required>
                <label for="conditions">I acknowledge the terms and conditions</label>
            </section>

            <section>
                <button type="submit">Submit</button>
            </section>
        </form>

        <div class="books">
            <img src="images/old_testament.webp" alt="Old Testament">
            <img src="images/new_testament.webp" alt="New Testament">
            <img src="images/book_of_mormon.webp" alt="Book of Mormon">
            <img src="images/doctrine_and_covenants.webp" alt="Doctrine and Covenants">
            <img src="images/pearl_of_great_price.webp" alt="Pearl of Great Price">
        </div>
    </div>

    <div id="output"></div>

    <script>
        // Here is some Javascript to start looking forward to wdd131
        document.getElementById("closeBtn").addEventListener("click", function () {
            document.getElementById("formContainer").style.display = "none";
         });
        const form = document.getElementById('myForm');
        const output = document.getElementById('output');

        form.addEventListener('submit', function (event) {
            event.preventDefault(); // Stop form from actually submitting

            const formData = new FormData(form);
            const entries = [];

            for (const [key, value] of formData.entries()) {
                if (key == "password") {
                    entries.push(`<strong>${key}</strong>: ${value} (you should probably encrypt the password)`);
                } else {
                    entries.push(`<strong>${key}</strong>: ${value}`);
                }
            }

            output.innerHTML = `
            <br>  
            <h3>Here is the data that would be sent to the server:</h3>
            <ul>
                ${entries.map(item => `<li>${item}</li>`).join('')}
            </ul>
            `;
                });
    </script>

</body>

</html>
